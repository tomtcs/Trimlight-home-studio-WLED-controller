name: Test Proxmox native install

on:
  pull_request:
    paths:
      - 'deploy/proxmox/**'
      - 'server.py'
      - 'nginx.conf'
      - '.github/workflows/test-proxmox-install.yml'

permissions:
  contents: read

jobs:
  native-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for file in deploy/proxmox/{create-lxc.sh,configure-ssh.sh,install.sh,update}; do
            bash -n "$file"
          done
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx openssh-server sshpass
      - name: Verify root SSH in both authentication modes
        run: |
          sudo bash -se -- "$PWD" <<'TEST'
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          password=$(openssl rand -hex 24)
          printf 'root:%s\n' "$password" | chpasswd
          passwd -S root | grep -q '^root P '
          bash "$1/deploy/proxmox/configure-ssh.sh" password
          ssh_args=(-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$scratch/known_hosts" -o ConnectTimeout=5)
          password_login() {
            sshpass -d 3 ssh "${ssh_args[@]}" -o PreferredAuthentications=password root@127.0.0.1 id -u 3<<< "$password"
          }
          test "$(password_login)" = 0
          ssh-keygen -q -t ed25519 -N '' -f "$scratch/id"
          install -d -m 0700 /root/.ssh
          install -m 0600 "$scratch/id.pub" /root/.ssh/authorized_keys
          bash "$1/deploy/proxmox/configure-ssh.sh" key
          test "$(ssh "${ssh_args[@]}" -o BatchMode=yes -o IdentitiesOnly=yes -i "$scratch/id" root@127.0.0.1 id -u)" = 0
          if password_login; then
            echo 'Password authentication was accepted in key-only mode.' >&2
            exit 1
          fi
          TEST
      - name: Verify installation, update, and rollback
        run: |
          sudo bash -se -- "$PWD" <<'TEST'
          set -euo pipefail
          app=/opt/trimlight-studio
          fixture=$(mktemp -d)
          trap 'rm -rf -- "$fixture"' EXIT
          cp -r "$1"/{deploy,site,nginx.conf,server.py} "$fixture"
          git -C "$fixture" init -q -b main
          git -C "$fixture" config user.name Test
          git -C "$fixture" config user.email test@example.invalid
          commit() {
            git -C "$fixture" add -A
            git -C "$fixture" commit -qm "$1"
          }
          verify() {
            curl -fsS http://127.0.0.1:8080/healthz
            curl -fsS http://127.0.0.1:8080/ >/dev/null
            curl -fsS http://127.0.0.1:8080/api/scheduler/status |
              python3 -c 'import json,sys; assert json.load(sys.stdin)["enabled"] is False'
            curl -fsS http://127.0.0.1:8080/api/app |
              python3 -c 'import json,sys; assert json.load(sys.stdin)["migrationTest"] == "retained"'
          }
          commit Initial
          install -d "$app"
          git init -q --bare "$app/repo.git"
          git --git-dir="$app/repo.git" remote add origin "$fixture"
          git --git-dir="$app/repo.git" fetch --no-tags origin main
          bash "$fixture/deploy/proxmox/install.sh"
          ss -lntH 'sport = :8000' | awk '$4 == "127.0.0.1:8000" {ok=1} END {exit !ok}'
          curl -fsS -H 'Content-Type: application/json' -d '{"migrationTest":"retained"}' http://127.0.0.1:8080/api/app
          verify
          first=$(readlink "$app/current")
          printf '\n<!-- update marker -->\n' >> "$fixture/site/index.html"
          commit Update
          /usr/local/sbin/update --check | grep -F 'Update available'
          test "$(readlink "$app/current")" = "$first"
          /usr/local/sbin/update
          second=$(readlink "$app/current")
          test "$second" != "$first"
          verify
          curl -fsS http://127.0.0.1:8080/ | grep -F 'update marker'
          test -s "$app/backups/studio-before-update.sqlite3"
          /usr/local/sbin/update | grep -F 'up to date'
          printf 'raise SystemExit(1)\n' > "$fixture/server.py"
          commit Broken
          if /usr/local/sbin/update; then
            echo 'Broken release was unexpectedly accepted.' >&2
            exit 1
          fi
          test "$(readlink "$app/current")" = "$second"
          verify
          TEST
